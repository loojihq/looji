[package]
name = "looji-ai"
description = "A provider-agnostic chat client with streamed tokens and cancellation. No GPUI or SQLite dependencies."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3"
looji-domain.workspace = true
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
looji-persistence.workspace = true
looji-symbols = { path = "../symbols" }
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
