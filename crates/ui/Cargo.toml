[package]
name = "looji-ui"
description = "GPUI views and the looji application entry point."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "looji"
path = "src/main.rs"

[dependencies]
looji-domain.workspace = true
looji-persistence.workspace = true
looji-ai.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
unicode-segmentation = "1.13.3"
uuid = "1.28.0"
pulldown-cmark = "0.13.4"
looji-report = { version = "0.1.0", path = "../report" }
looji-updates = { version = "0.1.0", path = "../updates" }
looji-knowledge = { version = "0.1.0", path = "../knowledge" }
looji-embed = { version = "0.1.0", path = "../embed" }
looji-diagram = { version = "0.1.0", path = "../diagram" }
serde_json = { version = "1", features = ["raw_value"] }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
