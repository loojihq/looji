[package]
name = "looji-embed"
description = "Local text embeddings with a small ONNX model, downloaded on first use. Kept apart so the rest of the app builds without ONNX Runtime."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fastembed = { version = "7.5", default-features = false, features = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls"] }
looji-knowledge = { path = "../knowledge" }
