[package]
name = "looji-persistence"
description = "SQLite storage for looji."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
looji-domain.workspace = true
directories = "6"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde_json = "1"
ignore = "0.4"
thiserror = "2"
uuid = "1.28.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3.27.0"
