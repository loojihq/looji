[package]
name = "looji-knowledge"
description = "The project knowledge base: chunks of code, docs, issues and commits, searched with SQLite full-text search."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
looji-domain.workspace = true
looji-symbols = { version = "0.0.1", path = "../symbols" }
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
notify = "8"
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
