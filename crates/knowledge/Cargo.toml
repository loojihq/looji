[package]
name = "looji-knowledge"
description = "The project knowledge base: chunks of code, docs, issues and commits, searched with SQLite full-text search."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
looji-domain.workspace = true
looji-symbols = { version = "0.0.1", path = "../symbols" }
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
notify = "8"
serde_json = "1"
sha2 = "0.11.1"
pdf-extract = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
lopdf = "0.31"

# Text from pictures comes from the OCR that Windows ships, so no model is downloaded.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Data_Pdf", "Win32_System_WinRT"] }
