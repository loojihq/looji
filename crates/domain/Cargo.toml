[package]
name = "looji-domain"
description = "Plain Rust domain types and rules. No GPUI or SQLite dependencies."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
uuid = { version = "1.28.0", features = ["v4"] }
# The zone database is compiled in, and the host's zone files are never read, so every host gets the same answers.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13.3"
